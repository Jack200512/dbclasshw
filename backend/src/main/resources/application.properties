spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DBCLASSHW_DB_URL:jdbc:mysql://127.0.0.1:3306/dbclasshw?characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DBCLASSHW_DB_USERNAME:}
spring.datasource.password=${DBCLASSHW_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
mybatis.configuration.map-underscore-to-camel-case=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=30m
